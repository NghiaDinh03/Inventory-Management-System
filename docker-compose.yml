version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ims_sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Sa_strong_password_2026
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "Sa_strong_password_2026", "-C", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  init-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ims_init_db
    environment:
      - MSSQL_SA_PASSWORD=Sa_strong_password_2026
    volumes:
      - ./database:/database:ro
      - ./docker/sqlserver-init:/init:ro
      - ./logs:/logs
    entrypoint: /bin/bash
    command: -c "bash /init/init.sh"
    depends_on:
      sqlserver:
        condition: service_healthy

  web:
    image: ims_web:latest
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: ims_web_app
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=InventoryDB;User Id=sa;Password=Sa_strong_password_2026;TrustServerCertificate=True;
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs
    depends_on:
      sqlserver:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
    restart: always

  dbgate:
    image: dbgate/dbgate
    container_name: ims_dbgate
    ports:
      - "3000:3000"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: always

volumes:
  sqlserver-data:
